name: Site Codex Cloud Delivery

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: site-codex-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  register_request:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[SITE CODEX]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Validate and register Codex Cloud request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.issue.body || ''
            if (!body.includes('<!-- site-codex-request:v1 -->')) {
              core.setFailed('missing Site Codex request marker')
              return
            }

            const requestId = body.match(/^REQUEST_ID:\s*(site-\d{10,}-[a-z0-9]{4,12})\s*$/mi)?.[1]
            const mode = body.match(/^MODE:\s*(ask|edit)\s*$/mi)?.[1]?.toLowerCase()
            const confirmed = body.match(/^CONFIRMED:\s*([^\n]+)\s*$/mi)?.[1]?.trim().toLowerCase()
            const prompt = body.match(/## 요청\s*\n+([\s\S]*?)(?:\n+## 실행 범위|$)/)?.[1]?.trim()

            if (!requestId || !mode || !prompt || prompt.length > 6000) {
              core.setFailed('invalid request id, mode, or prompt')
              return
            }
            if (mode === 'edit' && confirmed !== 'yes') {
              core.setFailed('edit request is not explicitly confirmed')
              return
            }

            const cloudPrompt = [
              `GitHub 저장소 ${context.repo.owner}/${context.repo.repo}에서 아래 요청을 처리`,
              `요청 기록 ${context.payload.issue.html_url}`,
              `모드 ${mode}`,
              '',
              mode === 'edit'
                ? '새 브랜치에서 구현하고 관련 검증을 실행한 뒤 main 직접 푸시 없이 Pull Request로 제안'
                : '저장소를 변경하지 않고 코드와 데이터 근거를 확인해 한국어로 답변',
              '비밀정보·브라우저 세션·로컬 auth.json을 요청하거나 출력하지 않음',
              '',
              '사용자 요청',
              prompt,
            ].join('\n')

            const comment = [
              '<!-- site-codex-result:v1 -->',
              `REQUEST_ID: ${requestId}`,
              'STATUS: cloud-ready',
              '',
              'Codex Cloud 실행 준비 완료',
              '',
              '- 연결된 Codex Cloud 작업 화면 열기',
              `- GitHub 저장소 ${context.repo.owner}/${context.repo.repo}가 연결된 환경 선택`,
              '- 아래 실행문을 붙여넣어 작업 시작',
              '- 수정 요청은 새 브랜치와 Pull Request로 검토 후 반영',
              '- Actions Secret·API 키·Access Token 불필요',
              '',
              'Codex Cloud · https://chatgpt.com/codex/cloud',
              '',
              '```text',
              cloudPrompt,
              '```',
            ].join('\n')

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: comment,
            })

  validate_cloud_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout proposed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Rebuild static browser bundle
        run: npm run build:browser

      - name: Enforce delivery budgets and generated-content boundary
        run: npm run validate:delivery

      - name: Verify dashboard automation contract
        run: npm run test:automation

      - name: Verify strategy-team scope
        run: npm run test:department
