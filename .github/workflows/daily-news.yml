name: Daily AI News & Stocks Crawl

# Refreshes news.json (per-company Korean news), stocks.json (real daily
# prices + market cap) and insights.json (rule-based toplines).
# Runs twice a day — morning & evening KST (UTC+9).
on:
  schedule:
    - cron: "30 21 * * *"   # 06:30 KST — 아침 업데이트(07:00 KST 이전 완료)
    - cron: "30 3 * * *"    # 12:30 KST — 점심 업데이트
    - cron: "30 10 * * *"   # 19:30 KST — 저녁 업데이트
    - cron: "30 15 * * *"   # 00:30 KST — 심야 업데이트
  workflow_dispatch:         # manual run
    inputs:
      market_force:
        description: "1 = ignore the 20h market-crawl freshness gate and re-crawl now"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: write
  models: read

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RETRY_ATTEMPTS: 3
      PIPELINE_TIMEOUT_MS: 300000
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      GITHUB_MODELS_MODEL: openai/gpt-4.1
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python for source-fragment translation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl authoritative English news → source excerpts
        run: node scripts/run-with-retry.mjs scripts/crawl-news.mjs

      - name: Crawl real stock prices + market cap
        run: node scripts/run-with-retry.mjs scripts/crawl-stocks.mjs

      - name: Crawl latest quarterly financials + headcount (실적 발표 주기 자동 최신화)
        run: node scripts/run-with-retry.mjs scripts/crawl-financials.mjs

      - name: Explain stock inflection points from news (변곡점 자동 설명)
        run: node scripts/run-with-retry.mjs scripts/crawl-stock-events.mjs

      - name: Generate AI Morning Briefing (Signal → Insight → Action)
        run: node scripts/run-with-retry.mjs scripts/generate-briefing.mjs

      - name: Generate Startup Radar + scorecards + monthly opportunity memo
        run: node scripts/run-with-retry.mjs scripts/startup-radar.mjs

      - name: Build daily insights (rule-based, deterministic — no API key)
        run: node scripts/run-with-retry.mjs scripts/build-insights.mjs

      - name: Crawl IB research (증권사 1페이저 + 기관 피드)
        run: node scripts/run-with-retry.mjs scripts/crawl-research.mjs

      - name: Append global AI market, shipment and consumer-survey discovery records
        run: MARKET_FORCE=${{ github.event.inputs.market_force || '0' }} node scripts/run-with-retry.mjs scripts/crawl-markets.mjs

      - name: Retry retained source links and store publisher-page text
        run: SOURCE_REFRESH_LIMIT=45 SOURCE_REFRESH_CONCURRENCY=4 node scripts/refresh-source-content.mjs

      - name: Resolve market discoveries to publisher-page evidence
        run: MARKET_SOURCE_REFRESH_LIMIT=150 MARKET_SOURCE_REFRESH_CONCURRENCY=4 node scripts/refresh-market-source-content.mjs

      - name: Reframe source briefs as fact, change and implication
        run: node scripts/reframe-source-briefs.mjs

      - name: Crawl complete a16z Top 100 web/mobile company lists
        run: node scripts/run-with-retry.mjs scripts/crawl-a16z-startups.mjs

      - name: Crawl startup strategies and source-grounded AI synthesis (주간)
        run: node scripts/run-with-retry.mjs scripts/crawl-startups.mjs

      - name: Refresh startup founders, executives and organization depth
        run: node scripts/run-with-retry.mjs scripts/crawl-startup-organizations.mjs
        env:
          STARTUP_ORG_REFRESH_BUDGET: 36
          STARTUP_ORG_MAX_AGE_DAYS: 21
          STARTUP_ORG_CONCURRENCY: 6

      - name: Localise distinct source-page sentences
        run: python scripts/translate_summarize.py

      - name: Re-check official company and executive pages
        run: node scripts/run-with-retry.mjs scripts/crawl-company-officials.mjs

      - name: Normalize company profiles + org coverage + live signals
        run: node scripts/run-with-retry.mjs scripts/crawl-companies.mjs

      - name: Accumulate AI infra & future-tech signals (기사 기반 누적)
        run: node scripts/run-with-retry.mjs scripts/crawl-infra.mjs

      - name: Accumulate AI monetization (business-model) signals (기사 기반 누적)
        run: node scripts/run-with-retry.mjs scripts/crawl-bizmodel.mjs

      - name: Reclassify company monetization to the 7-layer SW-service value chain
        run: node scripts/run-with-retry.mjs scripts/crawl-monetization.mjs

      - name: Build latest mobile AI business database snapshot
        run: node scripts/run-with-retry.mjs scripts/build-mobile-ai-business-db.mjs

      - name: Refresh deployment-company and AI services venture cases
        run: node scripts/run-with-retry.mjs scripts/crawl-strategic-ventures.mjs

      - name: Synthesize company business model, strategy, practices and executive quotes
        run: node scripts/run-with-retry.mjs scripts/build-company-intelligence.mjs
        env:
          # A first schema rollout may need one rate-limited request per company.
          # Later runs reuse evidence fingerprints and refresh only changed firms.
          PIPELINE_TIMEOUT_MS: 1200000
          GITHUB_MODELS_MAX_RETRY_WAIT_MS: 20000
          COMPANY_INTELLIGENCE_AI_BUDGET: 6

      - name: Build strict company-specific news index
        run: node scripts/run-with-retry.mjs scripts/build-company-news.mjs

      - name: Build source-backed NVIDIA investment portfolio map
        run: node scripts/run-with-retry.mjs scripts/build-nvidia-investments.mjs

      - name: Verify evidence, provenance and cumulative history
        run: node scripts/run-with-retry.mjs scripts/verify-pipeline.mjs

      - name: Audit agent — 전 산출물 감사(신선도·커버리지·엔진·금지어)
        run: node scripts/run-with-retry.mjs scripts/audit-agent.mjs

      - name: Build compact source-backed public datasets
        run: node scripts/run-with-retry.mjs scripts/build-public-data.mjs

      - name: Guard consulting shell and rebuild browser bundle
        run: |
          node scripts/run-with-retry.mjs scripts/test-department-fit.mjs
          node scripts/run-with-retry.mjs scripts/build-browser-bundle.mjs
          node scripts/run-with-retry.mjs scripts/test-automation.mjs

      - name: Archive verifiable pipeline records
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-audit-${{ github.run_id }}
          path: |
            audit.json
            quality.json
            history.json
            llm-health.json
            collection-health.json
          retention-days: 90

      - name: Commit refreshed data
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add news.json company-news.json stocks.json financials.json stock-events.json nvidia-investments.json deleted.json insights.json briefing.json radar.json research.json companies.json company-officials.json startups.json a16z-startups.json strategic-ventures.json business-model-forecasts.json mobile-ai-business-view.json market.json infra.json bizmodel.json monetization.json audit.json quality.json history.json llm-health.json collection-health.json executive-news-view.json news-view.json research-view.json market-view.json infra-view.json bizmodel-view.json data-version.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily AI news & stock refresh [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main; then
                exit 0
              fi
              echo "Push raced with a newer main commit; rebasing data commit (attempt $attempt/3)."
              git fetch origin main
              git rebase origin/main
            done
            echo "Could not push refreshed data after three rebases."
            exit 1
          fi
