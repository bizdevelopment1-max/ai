name: Continuous Site Intelligence Refresh

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      market_force:
        description: "1 = ignore the market freshness gate"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "schemas/**"
      - "package.json"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: intelligence-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RETRY_ATTEMPTS: 3
      PIPELINE_TIMEOUT_MS: 300000
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      GITHUB_MODELS_MODEL: openai/gpt-4.1
      GITHUB_TOKEN: ${{ github.token }}
      DATASET_PUBLICATION_STATE: staging
      DATASET_APPROVAL_STATUS: pending
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      SENSOR_TOWER_TOKEN: ${{ secrets.SENSOR_TOWER_TOKEN }}
      APPFIGURES_CLIENT_KEY: ${{ secrets.APPFIGURES_CLIENT_KEY }}
      APPFIGURES_ACCESS_TOKEN: ${{ secrets.APPFIGURES_ACCESS_TOKEN }}
      WIPO_PATENTSCOPE_USER: ${{ secrets.WIPO_PATENTSCOPE_USER }}
      WIPO_PATENTSCOPE_PASSWORD: ${{ secrets.WIPO_PATENTSCOPE_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resume cumulative staging branch
        shell: bash
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git fetch origin main
          if git fetch origin automation/data-staging:refs/remotes/origin/automation/data-staging 2>/dev/null; then
            git switch -C automation/data-staging refs/remotes/origin/automation/data-staging
            if ! git merge -X ours --no-edit origin/main; then
              # A public materialized view can be retired on main while the
              # cumulative data branch still carries an older generated copy.
              # Resolve only those modify/delete conflicts whose path no
              # longer exists on main; every other conflict remains fatal.
              while IFS= read -r path; do
                if ! git cat-file -e "origin/main:${path}" 2>/dev/null; then
                  git rm -f -- "$path"
                fi
              done < <(git diff --name-only --diff-filter=U)
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved staging conflicts remain; manual review required."
                git diff --name-only --diff-filter=U
                exit 1
              fi
              git commit --no-edit
            fi
          else
            git switch -c automation/data-staging origin/main
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run unified collection, verification and publication pipeline
        env:
          MARKET_FORCE: ${{ github.event.inputs.market_force || '0' }}
        run: npm run update:site
        # Delegated stage contract (implemented by scripts/update-site.mjs):
        # scripts/collect-source-registry.mjs · scripts/crawl-news.mjs
        # scripts/crawl-stocks.mjs · scripts/crawl-financials.mjs
        # scripts/build-nvidia-investments.mjs · scripts/crawl-research.mjs
        # scripts/crawl-markets.mjs · scripts/reframe-source-briefs.mjs
        # scripts/crawl-a16z-startups.mjs · scripts/crawl-startup-organizations.mjs
        # scripts/crawl-company-officials.mjs · scripts/crawl-companies.mjs
        # scripts/crawl-strategic-ventures.mjs · scripts/build-company-intelligence.mjs
        # scripts/build-company-news.mjs · scripts/build-mobile-ai-business-db.mjs
        # scripts/build-public-data.mjs · scripts/build-browser-bundle.mjs
        # STARTUP_ORG_REFRESH_BUDGET: 36
        # PIPELINE_TIMEOUT_MS: 1200000
        # GITHUB_MODELS_MAX_RETRY_WAIT_MS: 20000
        # COMPANY_INTELLIGENCE_AI_BUDGET: 6

      - name: Archive verifiable pipeline records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-audit-${{ github.run_id }}
          path: |
            automation-status.json
            site-content-manifest.json
            audit.json
            quality.json
            history.json
            llm-health.json
            collection-health.json
            source-collection-report.json
            source-snapshot.json
            source-ledger/
            intelligence-tracks.json
            intelligence-ledger/
            source-compliance-report.json
            dataset-manifest.json
            slo-report.json
          retention-days: 90

      - name: Package staging-only site preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-staging-${{ github.run_id }}
          path: |
            index.html
            styles.bundle.css
            app.bundle.js
            data.bundle.js
            data-version.json
            site-content-manifest.json
            content-lifecycle-report.json
            overview-view.json
            strategy-view.json
            intelligence-tracks.json
            business-model-forecasts.json
            assets/
          retention-days: 14

      - name: Open data-only staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add news.json company-news.json stocks.json financials.json stock-events.json nvidia-investments.json deleted.json insights.json briefing.json radar.json research.json companies.json company-officials.json startups.json a16z-startups.json strategic-ventures.json business-model-forecasts.json mobile-ai-business-view.json market.json infra.json bizmodel.json monetization.json audit.json quality.json history.json llm-health.json collection-health.json source-collection-report.json source-compliance-report.json source-snapshot.json source-ledger/ intelligence-tracks.json intelligence-ledger/ market-reverification-queue.json price-change-flags.json executive-news-view.json overview-view.json strategy-view.json news-view.json research-view.json market-view.json infra-view.json data-version.json site-content-manifest.json content-lifecycle-report.json automation-status.json dataset-manifest.json slo-report.json index.html app.bundle.js data.bundle.js styles.bundle.css
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          if git diff --cached --name-only | grep -Eq '^(scripts/|config/|\.github/|.*\.jsx$|styles\.css$|styles\.bundle\.css$|package\.json$)'; then
            echo "Schema/code change detected in data workflow; refusing mixed PR."
            exit 1
          fi
          git commit -m "chore: refresh verified site intelligence [skip ci]"
          git push --set-upstream origin automation/data-staging
          body="Automated cumulative data-only refresh. Review the staging artifact for run ${GITHUB_RUN_ID}. Every visible section is materialized from the content registry; raw observations remain in the append-only ledger."
          pr_number="$(gh pr list --base main --head automation/data-staging --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: cumulative intelligence refresh" --body "$body"
          else
            gh pr create --base main --head automation/data-staging --title "chore: cumulative intelligence refresh" --body "$body"
          fi
