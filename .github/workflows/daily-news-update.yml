name: Manual Site Intelligence Recovery

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: intelligence-data-writer
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RETRY_ATTEMPTS: 3
      GITHUB_TOKEN: ${{ github.token }}
      DATASET_PUBLICATION_STATE: staging
      DATASET_APPROVAL_STATUS: pending
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      SENSOR_TOWER_TOKEN: ${{ secrets.SENSOR_TOWER_TOKEN }}
      APPFIGURES_CLIENT_KEY: ${{ secrets.APPFIGURES_CLIENT_KEY }}
      APPFIGURES_ACCESS_TOKEN: ${{ secrets.APPFIGURES_ACCESS_TOKEN }}
      WIPO_PATENTSCOPE_USER: ${{ secrets.WIPO_PATENTSCOPE_USER }}
      WIPO_PATENTSCOPE_PASSWORD: ${{ secrets.WIPO_PATENTSCOPE_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run unified recovery pipeline
        run: npm run update:site:recovery
        # Delegated stage contract (implemented by scripts/update-site.mjs):
        # scripts/collect-source-registry.mjs · scripts/crawl-news.mjs
        # scripts/build-company-news.mjs · scripts/build-mobile-ai-business-db.mjs
        # scripts/build-public-data.mjs · scripts/build-browser-bundle.mjs

      - name: Package recovery evidence and preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-recovery-${{ github.run_id }}
          path: |
            automation-status.json
            site-content-manifest.json
            source-ledger/
            intelligence-tracks.json
            intelligence-ledger/
            dataset-manifest.json
            slo-report.json
            index.html
            styles.bundle.css
            app.bundle.js
            data.bundle.js
            overview-view.json
            strategy-view.json
            assets/
          retention-days: 90

      - name: Open data-only recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add news.json company-news.json nvidia-investments.json insights.json briefing.json radar.json research.json startups.json market.json infra.json bizmodel.json monetization.json mobile-ai-business-view.json audit.json quality.json history.json llm-health.json collection-health.json source-collection-report.json source-compliance-report.json source-snapshot.json source-ledger/ intelligence-tracks.json intelligence-ledger/ market-reverification-queue.json price-change-flags.json executive-news-view.json overview-view.json strategy-view.json news-view.json research-view.json market-view.json infra-view.json bizmodel-view.json data-version.json site-content-manifest.json automation-status.json dataset-manifest.json slo-report.json index.html app.bundle.js data.bundle.js styles.bundle.css
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          branch="automation/recovery-refresh-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "chore: recover verified site intelligence [skip ci]"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: staged source recovery ${GITHUB_RUN_ID}" --body "Manual recovery data PR. Review the site-recovery-${GITHUB_RUN_ID} artifact before approval."
