name: Daily Ha Thai & AI News Update

# Updates Ha Thai article summary and adds latest related AI news to news.json
# Scheduled for 11:40 KST (02:40 UTC)
on:
  # Manual recovery only. The primary pipeline already refreshes four times
  # daily; a second schedule caused concurrent writes to the same JSON files.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RETRY_ATTEMPTS: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Update Ha Thai article summary and add latest AI news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/run-with-retry.mjs scripts/update-ha-thai.mjs

      - name: Verify evidence, provenance and cumulative history
        run: node scripts/verify-pipeline.mjs

      - name: Audit published bundle
        run: node scripts/audit-agent.mjs

      - name: Commit changes
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add news.json insights.json briefing.json radar.json research.json startups.json market.json infra.json bizmodel.json audit.json quality.json history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Ha Thai article summary, add latest AI news and insights [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main; then
                exit 0
              fi
              echo "Push raced with a newer main commit; rebasing data commit (attempt $attempt/3)."
              git fetch origin main
              git rebase origin/main
            done
            echo "Could not push refreshed data after three rebases."
            exit 1
          fi
