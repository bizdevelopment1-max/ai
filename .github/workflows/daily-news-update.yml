name: Manual Source-Only News Recovery

# Manual source-only recovery. The main workflow handles routine refreshes.
on:
  # Manual recovery only. The primary pipeline already refreshes four times
  # daily; a second schedule caused concurrent writes to the same JSON files.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: intelligence-data-writer
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RETRY_ATTEMPTS: 3
      GITHUB_TOKEN: ${{ github.token }}
      DATASET_PUBLICATION_STATE: staging
      DATASET_APPROVAL_STATUS: pending
      SEC_USER_AGENT: "bizdevelopment1-max-ai ${{ github.actor }}@users.noreply.github.com"
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      SENSOR_TOWER_TOKEN: ${{ secrets.SENSOR_TOWER_TOKEN }}
      APPFIGURES_CLIENT_KEY: ${{ secrets.APPFIGURES_CLIENT_KEY }}
      APPFIGURES_ACCESS_TOKEN: ${{ secrets.APPFIGURES_ACCESS_TOKEN }}
      WIPO_PATENTSCOPE_USER: ${{ secrets.WIPO_PATENTSCOPE_USER }}
      WIPO_PATENTSCOPE_PASSWORD: ${{ secrets.WIPO_PATENTSCOPE_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Python for source-fragment translation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate ingest data contracts
        run: |
          node scripts/normalize-temporal-fields.mjs
          node scripts/validate-data-contracts.mjs --stage=ingest

      - name: Collect direct registry sources and append observations
        run: node scripts/run-with-retry.mjs scripts/collect-source-registry.mjs

      - name: Crawl publisher and RSS source excerpts
        run: node scripts/run-with-retry.mjs scripts/crawl-news.mjs

      - name: Apply mobile-AI focus before derived analysis
        run: node scripts/prune-retired-focus.mjs

      - name: Append global market discovery records
        run: node scripts/run-with-retry.mjs scripts/crawl-markets.mjs

      - name: Retry retained source links and store publisher-page text
        run: SOURCE_REFRESH_LIMIT=30 SOURCE_REFRESH_CONCURRENCY=4 node scripts/refresh-source-content.mjs

      - name: Resolve market discoveries to publisher-page evidence
        run: MARKET_SOURCE_REFRESH_LIMIT=90 MARKET_SOURCE_REFRESH_CONCURRENCY=4 node scripts/refresh-market-source-content.mjs

      - name: Localise distinct source-page sentences
        run: python scripts/translate_summarize.py

      - name: Build deterministic insights and briefing
        run: node scripts/run-with-retry.mjs scripts/build-insights.mjs
      - run: node scripts/run-with-retry.mjs scripts/generate-briefing.mjs

      - name: Build strict company-specific news index
        run: node scripts/run-with-retry.mjs scripts/build-company-news.mjs

      - name: Refresh current monetization snapshot
        run: node scripts/run-with-retry.mjs scripts/crawl-monetization.mjs

      - name: Build latest mobile AI business database snapshot
        run: node scripts/run-with-retry.mjs scripts/build-mobile-ai-business-db.mjs

      - name: Remove retired business focus from published datasets
        run: node scripts/prune-retired-focus.mjs

      - name: Rebuild canonical company registry after focus pruning
        run: node scripts/normalize-company-registry.mjs

      - name: Build source-backed NVIDIA investment portfolio map
        run: node scripts/run-with-retry.mjs scripts/build-nvidia-investments.mjs

      - name: Verify evidence, provenance and cumulative history
        run: |
          node scripts/normalize-temporal-fields.mjs
          node scripts/run-with-retry.mjs scripts/verify-pipeline.mjs

      - name: Rebuild decision view from verified evidence
        run: node scripts/run-with-retry.mjs scripts/build-mobile-ai-business-db.mjs

      - name: Validate MX decision-intelligence contract
        run: node scripts/validate-mx-intelligence.mjs

      - name: Audit published bundle
        run: node scripts/run-with-retry.mjs scripts/audit-agent.mjs

      - name: Minimize retained publisher content to evidence spans
        run: node scripts/minimize-retained-source-content.mjs

      - name: Enforce final mobile-AI focus gate
        run: node scripts/prune-retired-focus.mjs

      - name: Build compact public datasets
        run: node scripts/run-with-retry.mjs scripts/build-public-data.mjs

      - name: Build lineage manifest and SLO report
        env:
          DATASET_PUBLICATION_STATE: staging
        run: |
          node scripts/build-source-compliance-catalog.mjs
          node scripts/build-dataset-manifest.mjs
          node scripts/build-slo-report.mjs
          node scripts/archive-immutable-snapshot.mjs

      - name: Validate publication contracts and boundaries
        run: |
          node scripts/validate-data-contracts.mjs --stage=publish
          node scripts/validate-publication-policy.mjs
          node scripts/calibrate-dedup-threshold.mjs
          node scripts/validate-data-boundaries.mjs
          node scripts/validate-pipeline-dag.mjs
          node scripts/test-data-platform.mjs

      - name: Validate automation and browser bundle
        run: |
          node scripts/run-with-retry.mjs scripts/test-automation.mjs
          node scripts/test-visual-readability.mjs

      - name: Package staging-only site preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mx-recovery-staging-${{ github.run_id }}
          path: |
            index.html
            styles.css
            app.bundle.js
            data.bundle.js
            overview-view.json
            strategy-view.json
            mobile-ai-business-view.json
            assets/
          retention-days: 14

      - name: Archive direct-source observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-ledger-${{ github.run_id }}
          path: |
            source-collection-report.json
            source-snapshot.json
            source-ledger/
            source-compliance-report.json
            dataset-manifest.json
            slo-report.json
          retention-days: 90

      - name: Open data-only recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add news.json company-news.json nvidia-investments.json insights.json briefing.json radar.json research.json startups.json market.json infra.json bizmodel.json monetization.json mobile-ai-business-view.json audit.json quality.json history.json llm-health.json collection-health.json source-collection-report.json source-compliance-report.json source-snapshot.json source-ledger/ market-reverification-queue.json price-change-flags.json executive-news-view.json overview-view.json strategy-view.json news-view.json research-view.json market-view.json infra-view.json bizmodel-view.json data-version.json dataset-manifest.json slo-report.json index.html app.bundle.js data.bundle.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            if git diff --cached --name-only | grep -Eq '^(scripts/|config/|\.github/|.*\.jsx$|styles\.css$|package\.json$)'; then
              echo "Schema/code change detected in data workflow; refusing mixed PR."
              exit 1
            fi
            branch="automation/recovery-refresh-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "chore: update Ha Thai article summary, add latest AI news and insights [skip ci]"
            git push origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: staged source recovery ${GITHUB_RUN_ID}" \
              --body "Manual recovery data PR. No auto-merge. Review the **mx-recovery-staging-${GITHUB_RUN_ID}** artifact before approval."
          fi
