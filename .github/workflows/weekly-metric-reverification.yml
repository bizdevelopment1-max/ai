name: Weekly volatile metric reverification

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: intelligence-data-writer
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATASET_PUBLICATION_STATE: staging
      DATASET_APPROVAL_STATUS: pending
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Reverify official price and KPI literals
        run: node scripts/reverify-volatile-metrics.mjs --fetch --write
      - name: Validate schema and browser bundle
        run: |
          node scripts/reverify-volatile-metrics.mjs
          node scripts/build-mobile-ai-business-db.mjs
          node scripts/build-intelligence-tracks.mjs
          node scripts/validate-intelligence-tracks.mjs
          node scripts/build-public-data.mjs
          node scripts/test-automation.mjs
          node scripts/test-visual-readability.mjs
      - name: Build and validate lineage outputs
        env:
          DATASET_PUBLICATION_STATE: staging
        run: |
          node scripts/build-source-compliance-catalog.mjs
          node scripts/build-dataset-manifest.mjs
          node scripts/build-slo-report.mjs
          node scripts/validate-data-contracts.mjs --stage=publish
          node scripts/validate-publication-policy.mjs
          node scripts/calibrate-dedup-threshold.mjs
          node scripts/validate-data-boundaries.mjs
          node scripts/validate-pipeline-dag.mjs
          node scripts/test-data-platform.mjs
      - name: Upload staging audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: volatile-metric-audit-${{ github.run_id }}
          path: |
            volatile-metrics-audit.json
            metric-history.json
            overview-view.json
            strategy-view.json
            mobile-ai-business-view.json
            intelligence-tracks.json
            intelligence-ledger/
            source-compliance-report.json
            dataset-manifest.json
            slo-report.json
          retention-days: 30
      - name: Open review-only data PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mx-metric-bot"
          git config user.email "mx-metric-bot@users.noreply.github.com"
          git add volatile-metrics-audit.json metric-history.json overview-view.json strategy-view.json mobile-ai-business-view.json intelligence-tracks.json intelligence-ledger/ data-version.json source-compliance-report.json dataset-manifest.json slo-report.json index.html app.bundle.js data.bundle.js styles.bundle.css
          if git diff --staged --quiet; then
            echo "No metric changes."
          else
            branch="automation/weekly-metric-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "chore: reverify volatile AI metrics [skip ci]"
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title "chore: weekly volatile metric review ${GITHUB_RUN_ID}" --body "Official-source literal audit and append-only metric history. No auto-merge. Review the staging artifact and approve manually."
          fi
